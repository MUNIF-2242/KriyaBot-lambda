service: fambot-lambda

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 2048
  timeout: 900
  environment:
    OPENAI_API_KEY: ${file(.env.json):OPENAI_API_KEY}
    PINECONE_API_KEY: ${file(.env.json):PINECONE_API_KEY}
    BUCKET_NAME_FOR_KB: ${file(.env.json):BUCKET_NAME_FOR_KB}
    REGION_FOR_BEDROCK: ${file(.env.json):REGION_FOR_BEDROCK}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${file(.env.json):BUCKET_NAME_FOR_KB}/*"

        # ✅ Add Bedrock permissions
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource:
            - arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v1
            - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

  apiGateway:
    binaryMediaTypes:
      - "*/*" # or just 'application/pdf' if you want to be specific

functions:
  upload:
    handler: src/handlers/upload.handler
    events:
      - http:
          path: upload
          method: post
          cors: true

  index:
    handler: src/handlers/index.handler
    events:
      - http:
          path: index
          method: post
          cors: true

  ask:
    handler: src/handlers/ask.handler
    events:
      - http:
          path: ask
          method: post
          cors: true

  enhance:
    handler: src/handlers/enhance.handler
    events:
      - http:
          path: enhance
          method: post
          cors: true

  updateAnswer:
    handler: src/handlers/updateAnswer.handler
    events:
      - http:
          path: updateAnswer
          method: post
          cors: true

# No resources section needed - using existing bucket

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
