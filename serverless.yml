service: kriyabot-train-lambda

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 900
  environment:
    OPENAI_API_KEY: ${file(.env.json):OPENAI_API_KEY}
    PINECONE_API_KEY: ${file(.env.json):PINECONE_API_KEY}
    BUCKET_NAME_FOR_KB: ${file(.env.json):BUCKET_NAME_FOR_KB}
    REGION_FOR_BEDROCK: ${file(.env.json):REGION_FOR_BEDROCK}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${file(.env.json):BUCKET_NAME_FOR_KB}/*"

  apiGateway:
    binaryMediaTypes:
      - "*/*" # or just 'application/pdf' if you want to be specific

functions:
  upload:
    handler: src/handlers/uploadPdf.handler
    events:
      - http:
          path: uploadPdf
          method: post
          cors: true

  index:
    handler: src/handlers/processPdf.handler
    events:
      - http:
          path: processPdf
          method: post
          cors: true

  ask:
    handler: src/handlers/askQuestion.handler
    events:
      - http:
          path: askQuestion
          method: post
          cors: true

  enhance:
    handler: src/handlers/enhanceQuestion.handler
    events:
      - http:
          path: enhanceQuestion
          method: post
          cors: true

  updateAnswer:
    handler: src/handlers/updateAnswer.handler
    events:
      - http:
          path: updateAnswer
          method: post
          cors: true

  addKnowledgebase: # <- New function
    handler: src/handlers/addKnowledgebase.handler
    events:
      - http:
          path: addKnowledgebase
          method: post
          cors: true

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
